name: Release

# Push a version tag to publish a release and update the Homebrew tap:
#   git tag v0.2.0 && git push origin v0.2.0
#
# With the Developer ID secrets set, the app is signed, notarized and stapled.
# Without them, it falls back to an ad-hoc signed build.
on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      TAP_REPO: Hoshi-Corp/homebrew-cadence
      NOTARIZE: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Select newest stable Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|rc' | sort -V | tail -1)
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "Using $xcode"

      - name: Read version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Test
        run: make test

      - name: Import Developer ID certificate
        if: env.NOTARIZE == 'true'
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -t cert -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build universal app
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          flags=""
          if [ "$NOTARIZE" = "true" ]; then
            flags="CADENCE_SIGN_IDENTITY=\"Developer ID Application\" CADENCE_TEAM=$TEAM_ID"
          fi
          make dist VERSION=${{ steps.version.outputs.version }} \
            BUILD_NUMBER=${{ github.run_number }} DIST_FLAGS="$flags"

      - name: Notarize and staple
        if: env.NOTARIZE == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY }}
          API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$API_KEY_BASE64" | base64 --decode > "$key"
          xcrun notarytool submit "build/Cadence-$VERSION.zip" \
            --key "$key" --key-id "$API_KEY_ID" --issuer "$API_ISSUER_ID" --wait
          rm "$key"
          app=build/Build/Products/Release/Cadence.app
          xcrun stapler staple "$app"
          spctl --assess --type execute --verbose=2 "$app"
          # Re-zip so the download carries the stapled ticket.
          rm "build/Cadence-$VERSION.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "build/Cadence-$VERSION.zip"

      - name: Checksum
        id: sha
        run: |
          zip="build/Cadence-${{ steps.version.outputs.version }}.zip"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$zip" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.sha.outputs.zip }}" \
            --title "Cadence ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag

      - name: Check out tap
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPO }}
          # Deploy key with write access to the tap repository only.
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Update cask
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          # Only unnotarized builds need the quarantine flag cleared.
          quarantine=""
          if [ "$NOTARIZE" != "true" ]; then
            quarantine='
            # Ad-hoc signed, not notarized, so Gatekeeper would block it.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Cadence.app"]
            end
          '
          fi
          mkdir -p tap/Casks
          cat > tap/Casks/cadence.rb <<EOF
          cask "cadence" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v#{version}/Cadence-#{version}.zip"
            name "Cadence"
            desc "Menu bar Pomodoro timer with break reminders and a Markdown work log"
            homepage "https://github.com/${GITHUB_REPOSITORY}"

            depends_on macos: ">= :sonoma"

            app "Cadence.app"
          ${quarantine}
            uninstall quit: "com.masaruhoshi.cadence"

            # The Markdown work log in ~/Documents/Cadence is user data and is kept.
            zap trash: [
              "~/Library/Application Support/Cadence",
              "~/Library/Preferences/com.masaruhoshi.cadence.plist",
            ]
          end
          EOF

      - name: Push cask to tap
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/cadence.rb
          git commit -m "cadence ${{ steps.version.outputs.version }}"
          git push

      - name: Remove signing keychain
        if: always() && env.NOTARIZE == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
